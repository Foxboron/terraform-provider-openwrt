name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Determine tag and previous release
        id: tags
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -A1 "^${CURRENT_TAG}$" | tail -n1)

          echo "CURRENT_TAG=${CURRENT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Generate Changelog
        id: changelog
        run: |
          if [ -n "${{ steps.tags.outputs.PREVIOUS_TAG }}" ]; then
            CHANGELOG=$(git log --pretty=format:"* %h %s" \
              ${{ steps.tags.outputs.PREVIOUS_TAG }}..${{ steps.tags.outputs.CURRENT_TAG }})
          else
            CHANGELOG=$(git log --pretty=format:"* %h %s")
          fi

          {
            echo 'CHANGELOG<<EOF'
            echo "${CHANGELOG}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload release binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.CURRENT_TAG }}
          name: ${{ steps.tags.outputs.CURRENT_TAG }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          # we (humans) will have to put _the last touch_ on the release
          prerelease: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
